# Nexus: what this machine tells the networks it joins (0.1.86, outside
# review round 3, P2 and P4). Defaults only: a connection that sets
# either value itself keeps its own.
#
# dhcp-send-hostname=false: the machine's name (nexus-a1b2c3) is not
# sent when it asks a network for an address. NetworkManager already
# gives each Wi-Fi network its own MAC address; the same name in every
# request would link them again. Home routers will not show the name
# in their client list. Needs NetworkManager 1.52 or newer; older ones
# print "unknown key" for it in `NetworkManager --print-config`.
#
# ip6-privacy=2: on IPv6 networks, outgoing connections use temporary
# addresses that change, so sites do not see one fixed address.
#
# To send the name on one network (a home network where the router's
# list should show it):
#     nmcli connection modify "<network>" ipv4.dhcp-send-hostname yes

[connection-nexus-privacy]
ipv4.dhcp-send-hostname=false
ipv6.dhcp-send-hostname=false
ipv6.ip6-privacy=2
