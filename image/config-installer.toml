# The installer's configuration: no account, encrypted by default.
#
# Anaconda asks for a name and a password, the way every installer
# does. It never asked before because this file answered on the user's
# behalf -- which would have put the same known login on every machine
# that installed this.
#
# image/config.toml keeps its account: a disk image booted in a VM to
# check something has nobody to ask.
[customizations.installer.modules]
enable = [
    "org.fedoraproject.Anaconda.Modules.Users",
    "org.fedoraproject.Anaconda.Modules.Storage",
    "org.fedoraproject.Anaconda.Modules.Network",
]

# The kickstart, written here rather than left to the builder.
#
# Enabling the Users module was supposed to be enough and was not: the
# screen never appeared and machines installed with no account at all.
# Saying what the installation is explicitly leaves less to infer.
#
# What is deliberately absent matters as much as what is here. There is
# no `user` line and no `rootpw`, so Anaconda has to ask -- an ISO
# anybody can download must not carry a login that is written down in
# a public repository.
#
# There is no `reboot` and no `text`: this is an installer a person
# sits in front of, not an unattended one.
#
# autopart --encrypted with no --passphrase makes Anaconda ask for one.
# That is Decision 15: encryption is on unless the user turns it off,
# and turning it off is a thing they do rather than a thing that
# happens to them.
#
# ostreecontainer is not here. The builder writes that line itself and
# it is the one part of the installation a custom kickstart cannot
# configure.
[customizations.installer.kickstart]
#
# The hostname is set here because otherwise every machine installed
# from this ISO calls itself "fedora" -- on its own prompt, on the
# network, and in every log anybody sends asking for help. It is the
# same class of mistake as the branding in os-release, in the one
# place a person actually reads it.
#
# The keyboard is named explicitly for both the console and the
# desktop. The one-word form `keyboard us` left the kernel command
# line with an empty `vconsole.keymap=` on a VM installed on 22
# September. The console keymap is what the disk passphrase prompt
# uses, so it matters more than it looks: a passphrase typed on a
# layout other than the one it was set on is a "wrong passphrase"
# that is not wrong.
contents = """
lang en_US.UTF-8
keyboard --vckeymap=us --xlayouts=us
timezone UTC --utc

network --hostname=nexus

zerombr
clearpart --all --initlabel
autopart --type=lvm --encrypted --luks-version=luks2
"""
