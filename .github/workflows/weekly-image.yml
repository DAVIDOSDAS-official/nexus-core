# Build, sign and publish the Nexus-CORE images every week.
#
# Why this exists: Nexus is image-based. A machine's operating system
# (kernel, desktop, Firefox, every library) arrives only as a whole
# image, so Fedora's fixes reach users only when a new image is
# published. Flatpak apps update on their own; the system does not.
# This job is what makes "users update whenever they like" true without
# a person rebuilding by hand.
#
# Three jobs, and only the last can sign (0.1.86, outside review H1):
#   1. tests -- the test suite, with read-only access to the repository
#      and nothing else: no registry, no key.
#   2. build -- pulls the newest Fedora base, builds each edition with
#      fresh packages, checks the add-ons and pushes the image to a
#      staging tag no machine follows (<profile>-unsigned). It can push
#      to the registry but has no signing key.
#   3. sign -- waits for the maintainer to approve it in GitHub (the
#      "release" environment), then signs exactly the digest the build
#      job pushed, verifies the signature with the public key machines
#      carry, and only then points <profile> and <profile>-<version> at
#      it (image/promote.sh). The key is an environment secret: no
#      other job can read it.
#
# A failed or unapproved run changes nothing for users: machines follow
# <profile>, which moves only after a verified signature. GitHub emails
# the repository owner when a run fails, and when one waits for
# approval.
#
# One-time setup (HANDOFF, "Signing in its own job"):
#   - Settings -> Environments -> New environment "release": required
#     reviewer DAVIDOSDAS-official, deployment branches: main only
#   - environment secrets COSIGN_PRIVATE_KEY (the contents of
#     cosign.key) and COSIGN_PASSWORD in "release", and the repository
#     secrets of the same names deleted
#   - the package gives this repository write access
#     (package settings -> Manage Actions access)
#   - optional variable IMAGE_NAME; defaults to nexus-core-testing
#
# Not automatic: moving to the next Fedora release (FEDORA_VERSION in
# image/Containerfile), about once a year. See image/README.md.

name: Weekly image

on:
  schedule:
    # Mondays 03:00 UTC.
    - cron: "0 3 * * 1"
  # And by hand, from the Actions tab.
  workflow_dispatch:

# Nothing by default; each job asks for what it uses.
permissions: {}

concurrency:
  group: weekly-image
  cancel-in-progress: false

jobs:
  # The project's own code and apt run here, so nothing else does: no
  # registry login, no key, read-only checkout.
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # apt with short timeouts and retries, and the step capped at 20
      # minutes: on 1 October the runner's Ubuntu mirror (azure.archive)
      # stopped answering and apt-get update hung for over an hour,
      # holding the kde build hostage. A stuck mirror now fails in
      # minutes and the run can simply be re-run.
      - name: Tests
        timeout-minutes: 20
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get ${APT} update
          sudo apt-get ${APT} install -y cmake g++ libgtest-dev
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

  build:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write

    # One job per edition, side by side on separate runners. fail-fast
    # off: a broken minimal build must not stop the KDE edition from
    # getting its weekly fixes, and the other way round.
    strategy:
      fail-fast: false
      matrix:
        profile: [kde, minimal]

    # The digest each edition pushed, for the sign job. One output per
    # edition: matrix jobs share one set of outputs, so a single name
    # would hold whichever edition finished last.
    outputs:
      digest_kde: ${{ steps.stage.outputs.digest_kde }}
      digest_minimal: ${{ steps.stage.outputs.digest_minimal }}

    env:
      IMAGE_NAME: ${{ vars.IMAGE_NAME || 'nexus-core-testing' }}
      PROFILE: ${{ matrix.profile }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # The registry login goes in the job's own temporary directory
      # (the runner context is not available at job level, so it is set
      # here).
      - name: Where the login goes
        run: echo "REGISTRY_AUTH_FILE=${RUNNER_TEMP}/auth.json" >> "${GITHUB_ENV}"

      # The runner starts with about 14 GB free; the image and its
      # build stages need more. These are toolchains this job never
      # uses.
      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
              /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force > /dev/null || true
          df -h /

      # Every container image Nexus pulls on machines, resolved to the
      # digest its tag points at today and carried in the signed image
      # (0.1.81, after an outside review: they were pulled by tag).
      # Never fails the run: an image it cannot resolve stays by tag
      # and is named here.
      - name: Pin container images
        run: |
          FEDORA="$(sed -n 's/^ARG FEDORA_VERSION=//p' image/Containerfile)"
          python3 image/pin-images.py "${FEDORA}"

      - name: Build
        run: |
          FEDORA="$(sed -n 's/^ARG FEDORA_VERSION=//p' image/Containerfile)"
          # quay.io answers 502 now and then (10 November: both
          # editions failed on one bad answer). Three tries, a minute
          # apart, before the run is called failed.
          for try in 1 2 3; do
            podman pull "quay.io/fedora/fedora-bootc:${FEDORA}" && break
            [ "${try}" = 3 ] && { echo "quay.io did not answer after 3 tries."; exit 1; }
            echo "quay.io failed (try ${try}); again in 60 s."; sleep 60
          done
          # The Nexus version, for `nexus update` on machines (the
          # image's own version label is Fedora's).
          VERSION="$(sed -n 's/^ *VERSION \([0-9][0-9.]*\)$/\1/p' CMakeLists.txt | head -n 1)"
          test -n "${VERSION}"
          COMMIT="$(git rev-parse --short HEAD)"
          REFRESH="$(date -u +%Y%m%d)"
          # Twice at most: a Fedora mirror that hands out a broken file
          # fails dnf (11 November: "Unable to validate" on the minimal
          # edition, fine on re-run). The second try reuses every layer
          # the first one finished, so it costs only what failed. A real
          # mistake fails both times, and the log shows it twice.
          built=0
          : > build.log
          for try in 1 2; do
            podman build --target desktop \
                --label nexus.version="${VERSION}" \
                --build-arg NEXUS_PROFILE="${PROFILE}" \
                --build-arg NEXUS_COMMIT="${COMMIT}" \
                --build-arg REFRESH="${REFRESH}" \
                -t "localhost/nexus-os:${PROFILE}" \
                -f image/Containerfile . 2>&1 | tee -a build.log
            if [ "${PIPESTATUS[0]}" -eq 0 ]; then built=1; break; fi
            [ "${try}" = 1 ] && { echo "Build failed (try 1); again in 2 minutes."; sleep 120; }
          done
          test "${built}" -eq 1
          # Both tries are in the log, so the lines a cached layer does
          # not print again are still there.
          grep -E "Redistribution|Signing:|Splash|Identity|Pins:|Count Me" build.log
          # The Firefox version as a label, for security-watch.yml to
          # compare with Fedora's newest (0.1.82). A label-only build:
          # no new layer.
          FIREFOX="$(podman run --rm "localhost/nexus-os:${PROFILE}" \
              rpm -q --qf '%{VERSION}-%{RELEASE}' firefox 2>/dev/null || true)"
          # The Fedora base this was built from, by digest (0.1.85,
          # outside review L6). Not pinned in the Containerfile: the
          # build upgrades nothing, so a pinned base would freeze
          # Fedora's security fixes. Recorded instead, in the image.
          BASE="$(podman image inspect --format '{{.Digest}}' \
              "quay.io/fedora/fedora-bootc:${FEDORA}" 2>/dev/null || true)"
          LABELS=()
          [ -n "${FIREFOX}" ] && LABELS+=(--label "nexus.firefox=${FIREFOX}")
          [ -n "${BASE}" ] && LABELS+=(--label "nexus.base-digest=${BASE}")
          if [ "${#LABELS[@]}" -gt 0 ]; then
            echo "FROM localhost/nexus-os:${PROFILE}" | podman build \
                "${LABELS[@]}" -t "localhost/nexus-os:${PROFILE}" -f - "$(mktemp -d)"
          fi
          echo "Firefox: ${FIREFOX:-unknown}"
          echo "Base: quay.io/fedora/fedora-bootc:${FEDORA} at ${BASE:-unknown}"

      # Before anything is published: every add-on first boot offers
      # has to be installable from the repositories machines use.
      - name: Check the add-ons
        run: bash image/check-add-ons.sh "localhost/nexus-os:${PROFILE}"

      # Values through env, not pasted into the script text (0.1.84,
      # outside review / zizmor: template expansion inside run:).
      - name: Log in to GitHub Container Registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          printf '%s' "${REGISTRY_TOKEN}" | podman login ghcr.io \
              --username "${REGISTRY_USER}" --password-stdin

      # Push only, to <profile>-unsigned: no key in this job, and no
      # machine follows that tag.
      - name: Stage
        id: stage
        run: |
          DIGEST_OUT="${RUNNER_TEMP}/digest" STAGE=1 NAME="${IMAGE_NAME}" \
              PROFILE="${PROFILE}" ./image/publish.sh
          DIGEST="$(cat "${RUNNER_TEMP}/digest")"
          echo "digest_${PROFILE}=${DIGEST}" >> "${GITHUB_OUTPUT}"
          echo "### ${PROFILE}: staged ${DIGEST}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Forget the login
        if: always()
        run: rm -f "${REGISTRY_AUTH_FILE}"

  # Waits for approval in GitHub (Settings -> Environments -> release),
  # then signs and releases what the build job staged. Runs for each
  # edition that built; one that failed is skipped, so a broken minimal
  # build does not hold back the KDE edition.
  sign:
    needs: build
    # Not when nothing was staged: then there is nothing to approve.
    if: ${{ !cancelled() && (needs.build.outputs.digest_kde != '' || needs.build.outputs.digest_minimal != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        profile: [kde, minimal]

    env:
      IMAGE_NAME: ${{ vars.IMAGE_NAME || 'nexus-core-testing' }}
      PROFILE: ${{ matrix.profile }}
      DIGEST: ${{ needs.build.outputs[format('digest_{0}', matrix.profile)] }}

    steps:
      - name: Anything to sign?
        id: what
        run: |
          if printf '%s' "${DIGEST}" | grep -Eqx 'sha256:[0-9a-f]{64}'; then
            echo "Signing ${PROFILE}: ${DIGEST}"
            echo "sign=yes" >> "${GITHUB_OUTPUT}"
          else
            echo "The ${PROFILE} build did not stage an image; nothing to sign."
            echo "sign=no" >> "${GITHUB_OUTPUT}"
          fi

      - if: steps.what.outputs.sign == 'yes'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Where the login goes
        if: steps.what.outputs.sign == 'yes'
        run: echo "REGISTRY_AUTH_FILE=${RUNNER_TEMP}/auth.json" >> "${GITHUB_ENV}"

      # cosign 2.x, as image/promote.sh requires: cosign 3 writes
      # signatures the machines cannot read yet.
      - if: steps.what.outputs.sign == 'yes'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: "v2.4.1"

      # The key and its password must produce the public key in the
      # repository, or machines would refuse what it signs. Checked
      # before anything is signed (26 September: a secret pasted wrongly
      # left the newest image unsigned).
      - name: Check the signing key
        if: steps.what.outputs.sign == 'yes'
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          KEYFILE="${RUNNER_TEMP}/cosign.key"
          bash image/signing/write-key.sh "${KEYFILE}"
          trap 'rm -f "${KEYFILE}"' EXIT
          if ! cosign public-key --key "${KEYFILE}" > "${RUNNER_TEMP}/derived.pub"; then
            echo "The key could not be opened: COSIGN_PASSWORD is wrong,"
            echo "or COSIGN_PRIVATE_KEY was changed while pasting."
            echo "They are secrets of the 'release' environment now (0.1.86)."
            exit 1
          fi
          if ! diff -q <(tr -d '[:space:]' < "${RUNNER_TEMP}/derived.pub") \
                       <(tr -d '[:space:]' < image/signing/cosign.pub) > /dev/null; then
            echo "The key works but is not the partner of image/signing/cosign.pub."
            echo "Machines would refuse what it signs."
            exit 1
          fi
          echo "Signing key and password match image/signing/cosign.pub."

      - name: Log in to GitHub Container Registry
        if: steps.what.outputs.sign == 'yes'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          printf '%s' "${REGISTRY_TOKEN}" | podman login ghcr.io \
              --username "${REGISTRY_USER}" --password-stdin

      - name: Sign and release
        if: steps.what.outputs.sign == 'yes'
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          KEYFILE="${RUNNER_TEMP}/cosign.key"
          bash image/signing/write-key.sh "${KEYFILE}"
          trap 'rm -f "${KEYFILE}"' EXIT
          COSIGN_KEY="${KEYFILE}" NAME="${IMAGE_NAME}" PROFILE="${PROFILE}" \
              DIGEST="${DIGEST}" bash image/promote.sh

      - name: Forget the key
        if: always()
        run: rm -f "${RUNNER_TEMP}/cosign.key" "${REGISTRY_AUTH_FILE:-/nonexistent}"
