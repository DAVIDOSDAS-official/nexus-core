# The installer's configuration: no user.
#
# Anaconda asks for a name and a password, the way every installer
# does. It never asked before because image/config.toml answered on
# the user's behalf -- which would have put the same known login on
# every machine that installed this.
#
# image/config.toml keeps its account: a disk image booted in a VM to
# check something has nobody to ask.
[customizations.installer.modules]
enable = [
    "org.fedoraproject.Anaconda.Modules.Users",
    "org.fedoraproject.Anaconda.Modules.Storage",
    "org.fedoraproject.Anaconda.Modules.Network",
]

# A user, until Anaconda can be made to ask for one.
#
# Removing this was supposed to make the installer prompt. It does
# not: the Users module is enabled and the screen never appears, so
# the machine installs with no account and cannot be logged into.
#
# So the account is back, and the default credential it creates is a
# release blocker rather than a detail -- a published ISO must not
# carry a known login. The machine is told to demand a new password
# at first login, which is not a fix, only a smaller hole.
[[customizations.user]]
name = "nexus"
password = "nexus"
groups = ["wheel"]
