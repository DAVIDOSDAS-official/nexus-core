# The installer's configuration: no account, encrypted by default.
#
# Anaconda asks for a name and a password, the way every installer
# does. It never asked before because this file answered on the user's
# behalf -- which would have put the same known login on every machine
# that installed this.
#
# image/config.toml keeps its account: a disk image booted in a VM to
# check something has nobody to ask.
[customizations.installer.modules]
enable = [
    "org.fedoraproject.Anaconda.Modules.Users",
    "org.fedoraproject.Anaconda.Modules.Storage",
    "org.fedoraproject.Anaconda.Modules.Network",
    "org.fedoraproject.Anaconda.Modules.Localization",
    "org.fedoraproject.Anaconda.Modules.Timezone",
]

# The kickstart, written here rather than left to the builder.
#
# Enabling the Users module was supposed to be enough and was not: the
# screen never appeared and machines installed with no account at all.
# Saying what the installation is explicitly leaves less to infer.
#
# What is deliberately absent matters as much as what is here. There is
# no `user` line and no `rootpw`, so Anaconda has to ask -- an ISO
# anybody can download must not carry a login that is written down in
# a public repository.
#
# The disk. This used to say `clearpart --all`, which erases every disk
# the installer can see -- including a USB backup drive somebody left
# plugged in, and the Windows disk in a desktop with two. Now a %pre
# looks at the machine first:
#
#   - exactly one internal disk (not USB, not removable, not read-only,
#     20 GiB or more) with nothing on it: it is used and encrypted;
#   - one disk with anything on it (another system, files): nothing is
#     erased. With 30 GiB or more free in one piece (GPT, UEFI), Nexus
#     installs into the free space with its OWN EFI partition, /boot
#     and encrypted system -- never sharing the other system's boot
#     partition, which breaks ostree's boot menu (0.1.43). Otherwise
#     the Installation Destination screen asks;
#   - none, or more than one: nothing is decided, and the installer's
#     Installation Destination screen asks the person which disk, and
#     whether to encrypt it.
#
# Python rather than shell, and chr(10) rather than a backslash, because
# this whole kickstart sits in a TOML string, where a backslash is an
# escape. What it decided is in /tmp/nexus-disk.log during the install.
#
# There is no `reboot` and no `text`: this is an installer a person
# sits in front of, not an unattended one.
#
# autopart --encrypted with no --passphrase makes Anaconda ask for one.
# That is Decision 15: encryption is on unless the user turns it off,
# and turning it off is a thing they do rather than a thing that
# happens to them.
#
# The %post makes the installed machine require signed updates. The
# ISO installs from a copy of the image inside it, and the machine's
# origin would otherwise say ostree-unverified-registry: -- checking
# where an update came from but not who made it. bootc switch
# --mutate-in-place is meant for exactly this: it rewrites the origin
# without pulling anything. @NEXUS_IMAGE@ is filled in by
# image/build-installer.sh with the image the ISO is built from; see
# image/signing/README.md. --erroronfail: an install that cannot
# enforce signatures should stop rather than finish quietly without.
#
# ostreecontainer is not here. The builder writes that line itself and
# it is the one part of the installation a custom kickstart cannot
# configure.
[customizations.installer.kickstart]
#
# The hostname is set here because otherwise every machine installed
# from this ISO calls itself "fedora" -- on its own prompt, on the
# network, and in every log anybody sends asking for help. It is the
# same class of mistake as the branding in os-release, in the one
# place a person actually reads it.
#
# Language, keyboard and time zone are not here: the installer asks.
# (One exception, 0.1.45: when the %pre plans the disk itself, the
# installer asks for the disk password at its very start, so the %pre
# fixes the keyboard to US for that moment and the console stays US.
# Layouts added on the Keyboard screen still apply to the desktop.)
#
# They used to be answered on everybody's behalf -- US English, a US
# keyboard, UTC -- so every machine's clock was hours off anywhere but
# UTC (the Asus showed 13:15 at 15:15 in Skopje), and anyone whose
# keyboard is not a US one set a disk passphrase on the wrong layout:
# the passphrase prompt uses the console keymap, and a passphrase
# typed on another layout is a "wrong passphrase" that is not wrong.
# Choose the keyboard before the disk in the installer for that reason.
#
# The installer turns the chosen layouts into the console keymap
# through systemd's table, and with two layouts it can land on the
# wrong row: English (US) + Serbian (Latin) gave "us-acentos", a US
# keyboard where ' " ` ~ ^ wait for a second key (VM, 3 October). The
# disk password is typed on the desktop layout in the installer and on
# the console keymap at every start, so a password with a quote in it
# could stop working. The second %post sets the console keymap to the
# table's row for the first layout chosen, exactly (no variant means
# the row with none), in /etc/vconsole.conf and the boot arguments,
# and leaves it alone when there is no exact row. No backslashes in
# it: this is a TOML string. What it did: /var/log/nexus-install-keyboard.log.
#
# The installer may preselect a guess from the IP address (Fedora's
# GeoIP service). It is only a preselection on a screen the person
# confirms. After installing, automatic lookups are off unless turned
# on: see /usr/bin/nexus-timezone.
contents = """

network --hostname=nexus

# Which disk: decided by the %pre below, at install time, on the
# machine itself. See the comment above [customizations...kickstart].
%include /tmp/nexus-storage.ks

%pre --interpreter=/usr/bin/python3 --log=/tmp/nexus-disk.log
import shlex
import subprocess

SMALLEST = 20 * 1024 ** 3

listing = subprocess.run(
    ["lsblk", "-d", "-b", "-n", "-P", "-o", "NAME,TYPE,TRAN,RM,RO,SIZE"],
    capture_output=True, text=True).stdout

disks = []

for line in listing.splitlines():
    fields = dict(t.split("=", 1) for t in shlex.split(line) if "=" in t)
    name = fields.get("NAME", "")
    size = int(fields.get("SIZE") or 0)
    why = ""

    if fields.get("TYPE") != "disk":
        why = "not a disk"
    elif fields.get("TRAN") == "usb":
        why = "USB: the installer stick or somebody's backup"
    elif fields.get("RM") == "1":
        why = "removable"
    elif fields.get("RO") == "1":
        why = "read-only"
    elif name.startswith(("zram", "loop", "sr", "fd", "nbd", "ram")) or "boot" in name:
        why = "not somewhere to install"
    elif size < SMALLEST:
        why = "smaller than 20 GiB"

    print(name, size, "skipped: " + why if why else "internal disk")

    if not why:
        disks.append(name)

lines = ["# Written by the Nexus %pre at install time; see /tmp/nexus-disk.log."]

# Something already on the disk -- Windows, another Linux, an earlier
# Nexus, anybody's files -- is never erased by a decision made here.
# The person sees the installer's Installation Destination screen,
# which shows what is there and offers to use free space, shrink a
# partition, or delete: installing next to another system (dual boot)
# starts there. Only a disk with no filesystem on it at all is taken
# without asking. (0.1.42: before, the only internal disk was always
# erased, and with it a Windows that was the only thing on it.)
def in_use(disk):
    found = subprocess.run(
        ["lsblk", "-n", "-P", "-o", "NAME,TYPE,FSTYPE,LABEL", "/dev/" + disk],
        capture_output=True, text=True).stdout
    used = []
    for row in found.splitlines():
        f = dict(t.split("=", 1) for t in shlex.split(row) if "=" in t)
        if f.get("FSTYPE"):
            used.append(f.get("NAME", "") + " " + f.get("FSTYPE", "") +
                        (" " + f["LABEL"] if f.get("LABEL") else ""))
    return used

# Installing next to another system (0.1.43). Nexus gets its own EFI
# partition and its own /boot, in the free space, and never shares
# the other system's. Sharing it is what failed on the Asus next to
# Linux Mint: with Mint's GRUB files in the shared EFI partition,
# ostree switches from Nexus's fixed boot menu to rebuilding one with
# grub2-mkconfig, which cannot work inside the installer ("failed to
# get canonical path of LiveOS_rootfs") and would run again on every
# update. Fedora's image-based editions have the same limitation and
# the same advice: separate, empty boot partitions
# (github.com/fedora-silverblue/issue-tracker/issues/530).
#
# The free space is measured from /sys, where sizes are always in
# 512-byte sectors. Only the largest gap counts, because that is
# where the three partitions go. 30 GiB is the least it uses:
# 0.6 GiB EFI + 2 GiB /boot + the rest for the system.
# On a disk too full, an old MBR disk, or a machine started without
# UEFI, nothing is decided: the installer asks, as before.
NEEDED = 30 * 1024 ** 3

def read_int(path):
    try:
        with open(path) as f:
            return int(f.read().strip())
    except (OSError, ValueError):
        return 0

def largest_gap(disk):
    import os
    base = "/sys/block/" + disk
    total = read_int(base + "/size")
    used = []
    for entry in sorted(os.listdir(base)):
        if entry.startswith(disk) and os.path.exists(base + "/" + entry + "/start"):
            start = read_int(base + "/" + entry + "/start")
            used.append((start, start + read_int(base + "/" + entry + "/size")))
    used.sort()
    # The first MiB and the last 34 sectors belong to the partition
    # table itself.
    position = 2048
    gap = 0
    for start, end in used + [(total - 34, total - 34)]:
        gap = max(gap, start - position)
        position = max(position, end)
    return max(gap, 0) * 512

def table_type(disk):
    return subprocess.run(["lsblk", "-d", "-n", "-o", "PTTYPE", "/dev/" + disk],
                          capture_output=True, text=True).stdout.strip()

beside = ""

if len(disks) == 1 and in_use(disks[0]):
    disk = disks[0]
    print(disk, "already holds:")
    for item in in_use(disk):
        print("   ", item)
    print("Nothing on it is erased or changed.")
    gap = largest_gap(disk)
    print("Largest free space:", round(gap / 1024 ** 3, 1), "GiB")
    import os
    if not os.path.exists("/sys/firmware/efi"):
        print("Started without UEFI: the installer asks.")
    elif table_type(disk) != "gpt":
        print("Partition table is", table_type(disk) or "unknown", "not GPT: the installer asks.")
    elif gap < NEEDED:
        print("Less than 30 GiB free in one piece: the installer asks.")
    else:
        beside = disk
    disks = disks + ["(in use)"]

if beside:
    lines += [
        "ignoredisk --only-use=" + beside,
        "clearpart --none",
        "part /boot/efi --fstype=efi --size=600 --ondisk=" + beside,
        "part /boot --fstype=ext4 --size=2048 --ondisk=" + beside,
        "part / --fstype=xfs --grow --encrypted --luks-version=luks2 --ondisk=" + beside,
    ]
    print("Installing next to it, in the free space, with its own EFI partition and /boot.")
elif len(disks) == 1:
    disk = disks[0]
    lines += [
        "ignoredisk --only-use=" + disk,
        "zerombr",
        "clearpart --all --initlabel --drives=" + disk,
        "autopart --type=lvm --encrypted --luks-version=luks2",
    ]
    print("Installing to the only internal disk:", disk)
elif "(in use)" not in disks:
    print(len(disks), "internal disks: the installer asks which one.")

# The disk password. With the disk planned here, the installer asks for
# it the moment it starts -- before the keyboard screen (Asus,
# 12 October). It is typed on whatever layout is active then, and the
# console has to have that same layout at every start, or the same keys
# give a different password. So the layout is fixed to US for that
# moment, and the %post below keeps the console on US for this install;
# layouts added in the installer still work on the desktop.
if any("--encrypted" in line for line in lines):
    lines.append("keyboard --vckeymap=us --xlayouts=us")
    open("/tmp/nexus-early-passphrase", "w").close()
    print("Disk password asked at the start, on a US layout; the console keeps us.")

with open("/tmp/nexus-storage.ks", "w") as out:
    out.write(chr(10).join(lines) + chr(10))
%end

%pre-install --interpreter=/usr/bin/python3 --erroronfail --log=/tmp/nexus-esp-check.log
# Last check before anything is written: Nexus must not share another
# system's EFI partition. Shared, ostree sees the other system's GRUB
# files there and rebuilds the boot menu with grub2-mkconfig, which
# fails at the very end of the install (Asus, 11-12 October) and would
# fail again at every update. The %pre plans Nexus its own; this
# catches the plan being changed on the Installation Destination
# screen -- pressing Done there with Automatic selected re-plans the
# disk and reuses the other system's EFI partition.
import os
import sys

found = []
for root in ("/mnt/sysimage", "/mnt/sysroot"):
    efi = os.path.join(root, "boot/efi")
    for name in ("EFI", "efi"):
        path = os.path.join(efi, name)
        if os.path.isdir(path):
            for entry in os.listdir(path):
                if entry.lower() not in ("boot", "fedora") and os.path.isdir(os.path.join(path, entry)):
                    found.append(entry)

if found:
    message = (
        "This EFI partition already belongs to another system (EFI/" + ", EFI/".join(sorted(set(found))) + "). "
        "Nexus needs its own: shared, the install fails at the end. "
        "Nothing of the other system has been changed. "
        "Restart the installer and do not change Installation Destination: "
        "with free space next to the other system, Nexus plans its own EFI partition by itself."
    )
    print(message)
    print(message, file=sys.stderr)
    sys.exit(1)
print("EFI partition is Nexus's own.")
%end

%post --erroronfail
bootc switch --mutate-in-place --enforce-container-sigpolicy --transport registry @NEXUS_IMAGE@
%end

%post --nochroot --interpreter=/usr/bin/python3 --log=/tmp/nexus-post-nochroot.log
# Runs in the installer, outside the new system.
import glob
import os
import re
import subprocess

# Everything printed is also kept in the new system as
# /var/log/nexus-install-boot.log: the installer's /tmp is gone after
# the restart, and this is the part worth reading afterwards.
_kept = []
_print = print
def print(*words):
    _kept.append(" ".join(str(w) for w in words))
    _print(*words)

def run(command):
    done = subprocess.run(command, capture_output=True, text=True)
    return done.stdout if done.returncode == 0 else ""

# 1. Tell the keyboard %post that the disk password was typed on US
#    (see the %pre). Written into the new system's /etc.
if os.path.exists("/tmp/nexus-early-passphrase"):
    roots = ["/mnt/sysimage"] + glob.glob("/mnt/sys*/ostree/deploy/*/deploy/*.0")
    for root in roots:
        etc = os.path.join(root, "etc")
        if os.path.isdir(etc):
            os.makedirs(os.path.join(etc, "nexus"), exist_ok=True)
            open(os.path.join(etc, "nexus", "install-passphrase-us"), "w").close()
            print("marker in", etc)

# 2. The computer's start list. What the Asus showed (12-13 October,
#    /var/log/anaconda/packaging.log): bootupctl ran
#      efibootmgr --create --disk /dev/nvme0n1 --part 1 --loader
#      EFI/fedora/shimx64.efi --label Fedora
#    -- partition 1 is Linux Mint's EFI partition; Nexus's is 3. So the
#    entry pointed at a file that does not exist, sat first in the list,
#    and the firmware skipped it and started Mint. bootupd takes the
#    first EFI partition on the disk, not the one it installed to.
#    So: entries for Nexus's loader that point at another EFI partition
#    which does not have that file are removed, a correct entry is
#    made if there is none, and Nexus's entries go first. Entries of
#    other systems are never touched; a Fedora entry whose file really
#    is on another partition (a real Fedora there) stays.
SEP = chr(92)

def partition_has(partuuid, relative):
    device = "/dev/disk/by-partuuid/" + partuuid
    if not os.path.exists(device):
        return True  # cannot tell: keep it
    where = "/tmp/nexus-esp-look"
    os.makedirs(where, exist_ok=True)
    if subprocess.run(["mount", "-o", "ro", device, where]).returncode != 0:
        return True
    try:
        path = where
        for part in [p for p in relative.split(SEP) if p]:
            match = [e for e in os.listdir(path) if e.lower() == part.lower()]
            if not match:
                return False
            path = os.path.join(path, match[0])
        return os.path.isfile(path)
    finally:
        subprocess.run(["umount", where])

esp = ""
for root in ("/mnt/sysimage", "/mnt/sysroot"):
    esp = run(["findmnt", "-n", "-o", "SOURCE", os.path.join(root, "boot/efi")]).strip()
    if esp:
        break
info = run(["lsblk", "-n", "-o", "PARTUUID,PARTN,PKNAME", esp]).split() if esp else []
partuuid = info[0].lower() if len(info) > 0 else ""
partn = info[1] if len(info) > 1 else ""
disk = "/dev/" + info[2] if len(info) > 2 else ""
print("EFI partition:", esp or "?", "partuuid:", partuuid or "?", "number:", partn or "?", "disk:", disk or "?")

def entries():
    order, found = [], []
    for line in run(["efibootmgr"]).splitlines():
        if line.startswith("BootOrder:"):
            order = [n for n in line.split(":", 1)[1].strip().split(",") if n]
        m = re.match(r"Boot([0-9A-Fa-f]{4})[* ]+(.*)", line)
        if m:
            found.append((m.group(1), m.group(2)))
    return order, found

order, found = entries()
print("start order before:", ",".join(order) or "?")

if partuuid:
    loader = SEP + "EFI" + SEP + "fedora" + SEP + "shimx64.efi"
    for number, rest in found:
        low = rest.lower()
        other = re.search(r"gpt,([0-9a-f-]{36})", low)
        if not other or other.group(1) == partuuid:
            continue
        if SEP + "efi" + SEP + "fedora" + SEP not in low:
            continue
        path = rest[low.index(SEP + "efi" + SEP + "fedora" + SEP):].split(")")[0].strip()
        if partition_has(other.group(1), path):
            print("kept", number, "(its file is there):", rest)
            continue
        done = subprocess.run(["efibootmgr", "-b", number, "-B"], capture_output=True, text=True)
        print("removed", number, "-- points at", path, "on another EFI partition, which does not have it:",
              "ok" if done.returncode == 0 else done.stderr)

    order, found = entries()
    ours = [n for n, rest in found if partuuid in rest.lower()]
    if not ours and disk and partn:
        done = subprocess.run(["efibootmgr", "--create", "--disk", disk, "--part", partn,
                               "--loader", loader, "--label", "Nexus-CORE"],
                              capture_output=True, text=True)
        print("created an entry for Nexus:", "ok" if done.returncode == 0 else done.stderr)
        order, found = entries()
        ours = [n for n, rest in found if partuuid in rest.lower()]

    if ours and order:
        wanted = [n for n in order if n in ours] + [n for n in ours if n not in order]
        wanted += [n for n in order if n not in ours]
        if wanted != order:
            done = subprocess.run(["efibootmgr", "-o", ",".join(wanted)], capture_output=True, text=True)
            print("start order now:", ",".join(wanted), "ok" if done.returncode == 0 else done.stderr)
        else:
            print("Nexus is already first")

for target in ["/mnt/sysimage/var/log"] + glob.glob("/mnt/sys*/ostree/deploy/*/var/log"):
    if os.path.isdir(target):
        with open(os.path.join(target, "nexus-install-boot.log"), "w") as out:
            out.write(chr(10).join(_kept) + chr(10))
%end

%post --interpreter=/usr/bin/python3 --log=/var/log/nexus-install-keyboard.log
# The console keyboard -- the one the disk password is typed on at
# every start -- must match the first keyboard layout chosen in the
# installer. See the comment above [customizations...kickstart].
import os
import shlex
import subprocess

def read(path):
    try:
        with open(path) as f:
            return f.read().splitlines()
    except OSError:
        return []

xlayout = ""
xvariant = ""
for line in read("/etc/X11/xorg.conf.d/00-keyboard.conf"):
    words = shlex.split(line, comments=True)
    if len(words) == 3 and words[0] == "Option":
        if words[1] == "XkbLayout":
            xlayout = words[2].split(",")[0]
        elif words[1] == "XkbVariant":
            xvariant = words[2].split(",")[0]

keymap = ""
conf = read("/etc/vconsole.conf")
for line in conf:
    if line.startswith("KEYMAP="):
        keymap = line.split("=", 1)[1].strip().strip(chr(34))

wanted = ""
for line in read("/usr/share/systemd/kbd-model-map"):
    fields = line.split()
    if len(fields) < 4 or fields[0].startswith("#"):
        continue
    if fields[1] == xlayout and fields[3] == (xvariant or "-"):
        wanted = fields[0]
        break

print("desktop layout:", xlayout or "?", "variant:", xvariant or "none")
print("console keymap:", keymap or "?", "matching row:", wanted or "none")

# The disk password was asked before the keyboard screen, on US (the
# %pre, 0.1.45): the console stays on US so the same keys open it.
early = os.path.exists("/etc/nexus/install-passphrase-us")
if early:
    print("disk password typed on us at the start: console keymap us")
    wanted = "us"
    xlayout = xlayout or "us"

# Only a keymap this system actually has.
present = False
for top, dirs, files in os.walk("/usr/lib/kbd/keymaps"):
    if wanted + ".map.gz" in files or wanted + ".map" in files:
        present = True
        break
if wanted and not present:
    print("no keymap file for", wanted)

if xlayout and (keymap or early) and wanted and present and wanted != keymap:
    if not any(line.startswith("KEYMAP=") for line in conf):
        conf.append("KEYMAP=")
    with open("/etc/vconsole.conf", "w") as f:
        for line in conf:
            if line.startswith("KEYMAP="):
                line = "KEYMAP=" + chr(34) + wanted + chr(34)
            f.write(line + chr(10))
    done = subprocess.run(["ostree", "admin", "instutil", "set-kargs", "--merge",
                           "--replace=vconsole.keymap=" + wanted])
    print("changed to", wanted, "(boot arguments:",
          "ok" if done.returncode == 0 else "failed", ")")
else:
    print("left as it is")
%end
"""
